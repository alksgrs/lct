layers:
  - pattern: "^SITE_BOUNDARY$"
    kind: SITE_BOUNDARY
  - pattern: "^PIPE_WATER$"
    kind: PIPE_WATER
  - pattern: "^BUILDING$"
    kind: BUILDING
  - pattern: "^ГРАНИЦА_ЗАКАЗА$"
    kind: SITE_BOUNDARY
  - pattern: "ВОДОПР"
    kind: PIPE_WATER
  - pattern: "КАНАЛИЗ"
    kind: PIPE_SEWER
  - pattern: "ВОДОСТОК"
    kind: PIPE_DRAINAGE
  - pattern: "ГАЗ(?!ОН)"
    kind: PIPE_GAS
  - pattern: "ТЕПЛО"
    kind: PIPE_HEAT
  - pattern: "СВЯЗ"
    kind: CABLE
  - pattern: "КАБЕЛ"
    kind: CABLE
  - pattern: "ДОРОГ"
    kind: ROAD
  - pattern: "^ГП\\d?_+\\d"
    kind: ROAD
  - pattern: "ТИП_*\\d+.*(_ТР(_|$)|ТРОТ)"
    kind: PAVEMENT
  - pattern: "(^|_)ТИП_*\\d"
    kind: ROAD
  - pattern: "ПЛ_ТР"
    kind: PAVEMENT
  - pattern: "ЗДАН"
    kind: BUILDING
  - pattern: "ЛЭП"
    kind: POWERLINE
  - pattern: "СВЕТИЛ"
    kind: LIGHTING
